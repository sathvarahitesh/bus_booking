<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f5f7fb;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;">
        <tr><td style="background:#0a3d91;color:#ffffff;padding:18px 24px;font-size:20px;font-weight:bold;">{{ site_name }}</td></tr>
        <tr><td style="padding:24px;color:#212529;font-size:15px;line-height:1.5;">
          <p>Hello {{ name }},</p>
          <p>Use this code to {{ action }}:</p>
          <p style="text-align:center;font-size:32px;letter-spacing:8px;font-weight:bold;color:#0a3d91;margin:24px 0;">{{ code }}</p>
          <p>The code expires in {{ minutes }} minutes and can be used only once.</p>
          <p style="color:#6c7a8f;font-size:13px;">If you did not request this, you can ignore this email. Never share this code with anyone.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
